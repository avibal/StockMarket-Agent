name: Daily QQQ Volatility Committee Scan

on:
  workflow_dispatch: # Triggered on-time via external webhook (cron-job.org) or manual run

permissions:
  contents: write

jobs:
  scan-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QQQ Volatility Analysis & Send Telegram Push
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python strategies/qqq_volatility/report_generator.py --notify

      - name: Commit and Push Updated Reports to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add stock_analysis_reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update daily QQQ Volatility report [skip ci]" && git push)
